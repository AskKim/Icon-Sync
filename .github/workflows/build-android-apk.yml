# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build Icon Sync Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK when ICONSYNC_KEYSTORE_* secrets are configured'
        required: false
        default: true
        type: boolean

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Test, Lint & Assemble Icon Sync APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify & install Android SDK 35 components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools..."
            TMP_ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q "$TMP_ZIP" -d "$RUNNER_TEMP/cmdline-extract"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdline-extract/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_ZIP" "$RUNNER_TEMP/cmdline-extract"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          echo "Android SDK 35 verified at $SDK_ROOT"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: android

      - name: Run Kotlin unit tests (GridRemapperTest)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run Android Lint (non-blocking report)
        working-directory: android
        continue-on-error: true
        run: gradle lintDebug --no-daemon --stacktrace --console=plain

      - name: Assemble Debug APK (IconSync)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Check release signing secrets availability
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ICONSYNC_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ICONSYNC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ICONSYNC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ICONSYNC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets (ICONSYNC_KEYSTORE_*) are not configured; publishing sideloadable Debug APK only."
          fi

      - name: Decode release keystore & assemble signed Release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ICONSYNC_KEYSTORE_BASE64 }}
          ICONSYNC_KEYSTORE_PASSWORD: ${{ secrets.ICONSYNC_KEYSTORE_PASSWORD }}
          ICONSYNC_KEY_ALIAS: ${{ secrets.ICONSYNC_KEY_ALIAS }}
          ICONSYNC_KEY_PASSWORD: ${{ secrets.ICONSYNC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/iconsync-release.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded ICONSYNC_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          export ICONSYNC_KEYSTORE_PATH="$KEYSTORE_FILE"
          gradle assembleRelease --no-daemon --stacktrace --console=plain

      - name: Generate SHA-256 checksums & build summary
        working-directory: android/app/build/outputs/apk
        run: |
          set -euo pipefail
          find . -type f -name '*.apk' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          if [ ! -s SHA256SUMS.txt ]; then
            echo "::error::No APK files were generated."
            exit 1
          fi
          cat SHA256SUMS.txt
          {
            echo "## Icon Sync Android APK Build Summary"
            echo ""
            echo "| APK File | Size | SHA-256 |"
            echo "| :--- | ---: | :--- |"
            while IFS= read -r line; do
              hash="${line%% *}"
              filepath="${line#*  }"
              size="$(du -h "$filepath" | cut -f1)"
              echo "| \`$filepath\` | $size | \`$hash\` |"
            done < SHA256SUMS.txt
            echo ""
            echo "> **Sideload Note:** The Debug APK is automatically signed with a debug key and can be installed directly on Android 8.0+ (API 26+) devices for Alpha testing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IconSync-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK artifact (if signed)
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
        uses: actions/upload-artifact@v4
        with:
          name: IconSync-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload Android Lint & Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IconSync-android-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

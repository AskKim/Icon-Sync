# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release Icon Sync (APK + Web Studio)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.1.0-alpha.1)'
        required: true
        default: 'v0.1.0-alpha.1'
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build APK & Web Bundle and Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag & pre-release flag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web Studio bundle
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run lint
          npm run build
          mkdir -p release-assets
          TAR_FILES=(dist server.ts package.json LICENSE NOTICE.md PRIVACY.md DATA_MAP.md CHANGELOG.md)
          if [ -f package-lock.json ]; then
            TAR_FILES+=(package-lock.json)
          fi
          tar -czf "release-assets/IconSync-web-${{ steps.tag.outputs.name }}.tar.gz" "${TAR_FILES[@]}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify & install Android SDK 35 components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            TMP_ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q "$TMP_ZIP" -d "$RUNNER_TEMP/cmdline-extract"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdline-extract/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_ZIP" "$RUNNER_TEMP/cmdline-extract"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: android

      - name: Test & build Android APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ICONSYNC_KEYSTORE_BASE64 }}
          ICONSYNC_KEYSTORE_PASSWORD: ${{ secrets.ICONSYNC_KEYSTORE_PASSWORD }}
          ICONSYNC_KEY_ALIAS: ${{ secrets.ICONSYNC_KEY_ALIAS }}
          ICONSYNC_KEY_PASSWORD: ${{ secrets.ICONSYNC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain
          cp app/build/outputs/apk/debug/*.apk ../release-assets/
          if [ -n "$KEYSTORE_B64" ] && [ -n "$ICONSYNC_KEYSTORE_PASSWORD" ] && [ -n "$ICONSYNC_KEY_ALIAS" ] && [ -n "$ICONSYNC_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/iconsync-release.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            if [ ! -s "$KEYSTORE_FILE" ]; then
              echo "::error::Decoded ICONSYNC_KEYSTORE_BASE64 is empty."
              exit 1
            fi
            export ICONSYNC_KEYSTORE_PATH="$KEYSTORE_FILE"
            gradle assembleRelease --no-daemon --stacktrace --console=plain
            cp app/build/outputs/apk/release/*.apk ../release-assets/
          fi

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release notes file (if present)
        id: notes
        run: |
          NOTES_FILE="RELEASE_NOTES_${{ steps.tag.outputs.name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Icon Sync ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: release-assets/*
